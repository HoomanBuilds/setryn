[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000
max_test_rejects = 65_536
seed = "0x1"

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false
call_override = false

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 2_000 }
verbosity = 3

[profile.arbitrum_one_fork]
eth_rpc_url = "${ARBITRUM_RPC_URL}"

[profile.arbitrum_one_current]
eth_rpc_url = "${ARBITRUM_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
local = "${LOCAL_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
